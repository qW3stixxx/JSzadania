<h2>Zadanie 56 — znajdź 40 liczb pierwszych z wzoru (demo: prosty test)</h2>
<p>W instrukcji jest wzór — tutaj pokazuję przykład znalezienia 40 pierwszych liczb naturalnych spełniających test pierwszości.</p>
<button onclick="zad56()">Znajdź 40</button>
<pre id="wynik56"></pre>

<script>
function isPrime(n){
  if(n<2) return false;
  for(var i=2;i*i<=n;i++) if(n%i===0) return false;
  return true;
}
function zad56(){
  var found = 0, i=2, out="";
  while(found<40){
    if(isPrime(i)){ out += "i=" + found + " -> " + i + "\n"; found++; }
    i++;
  }
  document.getElementById('wynik56').innerText = out;
}
</script>
