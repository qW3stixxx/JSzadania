<body>
<h2>Zadanie 49 — silnia n! (przykładowая реализация)</h2>
<input id="n_ara" placeholder="Podaj n (>=0)">
<button onclick="zad49()">Oblicz n!</button>
<div id="wynik49" style="margin-top:1rem"></div>

<script>
function zad49(){
  var n = parseInt(document.getElementById('n_ara').value,10);
  if(isNaN(n) || n<0){ document.getElementById('wynik49').innerText="Podaj n >= 0"; return; }
  var silnia = 1;
  if(n===0) silnia = 1;
  else {
    for(var ara_i=1; ara_i<=n; ara_i++) silnia *= ara_i;
  }
  document.getElementById('wynik49').innerText = n + "! = " + silnia;
}
</script>
</body>
