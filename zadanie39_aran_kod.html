<div id="wynik39" style="margin-top:1rem; font-size:28px;">Tekst przykładowy</div>

<script>
function wykonaj39(){
  var opcja_dana_ara = document.getElementById('opcja_dana_ara').value.trim();
  var el = document.getElementById('wynik39');
  if(!opcja_dana_ara){
    el.innerHTML = "Nie podano koloru.";
    el.style.color = "black";
    return;
  }
  el.style.color = opcja_dana_ara;
  el.innerHTML = "Kolor ustawiony na: " + opcja_dana_ara;
}
</script>
