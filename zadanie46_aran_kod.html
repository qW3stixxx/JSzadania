<body>
<h2>Zadanie 46 — do...while sprawdza czy podano dodatnie liczby (podstawa i wysokość trójkąta)</h2>
<button onclick="zad46()">Wczytaj dane</button>
<div id="wynik46" style="margin-top:1rem"></div>

<script>
function zad46(){
  var a_ara, h_ara;
  do {
    a_ara = parseFloat(prompt("Podaj podstawę trójkąta (a > 0):", ""));
  } while(!(a_ara>0));
  do {
    h_ara = parseFloat(prompt("Podaj wysokość trójkąta (h > 0):", ""));
  } while(!(h_ara>0));
  var pole = 0.5 * a_ara * h_ara;
  document.getElementById('wynik46').innerHTML = "Podstawa: "+a_ara+"; Wysokość: "+h_ara+"; Pole = "+pole;
}
</script>
</body>
</html>
