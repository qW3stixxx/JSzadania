 <script language="JavaScript">
function Y1(x1)
{
 x1_liczba=parseFloat(x1);
 x2=(x1*Math.PI)/180;
 Y1=3*x1*Math.pow(x1,5/7);
 document.getElementsByName('obj')[0].value=Y1.toFixed(2); /* na dokument */
 pokaz1.innerHTML="y1="+Y1.toFixed(2)+"<br>"; /* do tabeli */
 }
function Y2(x1)
{
 x1_liczba=parseFloat(x1);
 x2=(x1*Math.PI)/180;
 Y2=2*Math.cos(x1_liczba)+3*Math.sin(x1_liczba);
 document.getElementsByName('pole')[0].value=Y2.toFixed(2);
 pokaz2.innerHTML="y2="+Y2.toFixed(2);
}
function Y3(x1)
{
 x1_liczba=parseFloat(x1);
 x2=(x1*Math.PI)/180;
 Y3_p=Math.pow(x1,5)+Math.pow(x2,4);
 Y3=Math.pow(Y3_p,1/3)*Math.abs(x1-x2);
 document.getElementsByName('pole')[0].value=Y3.toFixed(2);
 pokaz3.innerHTML="y3="+Y3.toFixed(2);
}
 </script>
