        document.write("<h1>Zadanie 2:</h1>");

                }

        document.write("<p>Średnia punktów: " + sredniaPunktow.toFixed(2) + "</p>");

        function usunDuplikaty(tablica) {
            const unikalne = [];
            for (let i = 0; i < tablica.length; i++) {
                let czyIstnieje = false;
                for (let j = 0; j < unikalne.length; j++) {
                    if (tablica[i] === unikalne[j]) {
                        czyIstnieje = true;
                        break;
                    }
                }

                    unikalne.push(tablica[i]);
                }
            }

        }

        const zakupy = ["jabłka", "mleko", "chleb", "jabłka", "ser", "mleko", "masło"];
        const produkty = [];
        const liczniki = [];
        
        for(let i = 0; i < zakupy.length; i++) {
            let produkt = zakupy[i];
            let znaleziony = -1;
            
            for(let j = 0; j < produkty.length; j++) {
                if(produkty[j] === produkt) {
                    znaleziony = j;
                    break;
                }
            }
            
            if(znaleziony === -1) {
                produkty.push(produkt);
                liczniki.push(1);
            } else {
                liczniki[znaleziony]++;
            }
        }
        
        document.write("<h3>Zadanie 3:</h3>");
        document.write("<p>Ilość wystąpień produktów:</p>");
        for(let i = 0; i < produkty.length; i++) {
            document.write("<p>" + produkty[i] + ": " + liczniki[i] + "</p>");
