<script>
var imie = "Tymur", nazwisko = "Aranzhii";
function zad44(){
  var lenNaz = nazwisko.length;
  var ile = (lenNaz % 4) + 10;
  var size = (lenNaz % 3) + 40; 
  var out = document.getElementById('wynik44');
  out.innerHTML = "<b>ilość wykonania pętli =</b> " + ile + "<br><b>wielkość liter =</b> " + size + "px<br><br>";
  for(var ara_i=1; ara_i<=ile; ara_i++){
    var tekst = (ara_i % 2 === 1) ? nazwisko : imie;
    out.innerHTML += "<p style='font-size:"+size+"px;margin:2px'>"+tekst+"</p>";
  }
}
</script>
