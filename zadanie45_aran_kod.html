  var size = (lenNaz % 3) + 40;

  var tekstDo = (v % 2 === 0) ? "nazwisko" : "imię";
  for(var ara_i=1; ara_i<=ile; ara_i++){
    if(v % 2 === 0){
      out.innerHTML += "<p style='color:blue;font-size:"+size+"px'>Aranzhii</p>";
    } else {
      out.innerHTML += "<p style='color:green;font-size:"+size+"px'>Tymur</p>";
    }
  }
}
