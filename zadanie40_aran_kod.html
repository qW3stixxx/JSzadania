    <form> 
         <textarea name="siejka" cols="80" rows="20" readonly> 
  <!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Zadanie40 - Aranzhii</title>
</head>
<body>
<h2>Zadanie 40 — dzielenie z kontrolą (nie dziel przez zero)</h2>
<input id="a_ara" placeholder="Podaj a">
<input id="b_ara" placeholder="Podaj b">
<button onclick="dziel40()">Oblicz a / b</button>
<div id="wynik40" style="margin-top:1rem; font-size:22px; color:green"></div>

<script>
function dziel40(){
  var a = document.getElementById('a_ara').value;
  var b = document.getElementById('b_ara').value;
  if(a==="" || b===""){ document.getElementById('wynik40').innerText="Podaj obie liczby."; return; }
  var na = parseFloat(a);
  var nb = parseFloat(b);
  if(isNaN(na) || isNaN(nb)){ document.getElementById('wynik40').innerText="Niepoprawne liczby."; return; }
  if(nb === 0){ document.getElementById('wynik40').innerText="Nie wolno dzielić przez zero."; return; }
  var iloraz = na/nb;
  document.getElementById('wynik40').innerText = "Wynik: " + iloraz;
}
</script>
</body>
</html>

           </textarea> 
</form> 
<input type="button" value="zamknij okno" onclick="okno_zamknij_siejka()"/>
