<h2>Zadanie 43</h2>
<input id="koniec_petli_ara" placeholder="Podaj N (liczba całkowita)">
<button onclick="zad43()">Pokaż</button>
<div id="wynik43" style="margin-top:1rem"></div>

<script>
function zad43(){
  var n = parseInt(document.getElementById('koniec_petli_ara').value,10);
  var out = document.getElementById('wynik43'); out.innerHTML="";
  if(isNaN(n) || n<2){ out.innerText = "Podaj N >= 2"; return; }
  for(var ara_i=2; ara_i<=n; ara_i+=2){
    out.innerHTML += ara_i + " ";
  }
}
</script>
