<script language="JavaScript">
var R= parseFloat(prompt("Podaj promień koła R:", ""));
var N = 0;
var R_int_ = Math.floor(R);
for(i = Math.floor(-R-1); i <= Math.floor(R+1); i++)
{
for(j = Math.floor(-R-1); j <= Math.floor(R+1); j++)
{
if(i*i + j*j<= R*R)
{
N++;
}
}
}
document.write("Promień koła R = " + R + "<br>");
document.write("Liczba punktów kratowych N(R) = " + N + "<br>");
</script>
</body>
