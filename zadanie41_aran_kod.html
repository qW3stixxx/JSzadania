<h1>Zadanie 41 — Teoria pętli</h1>
<h2>1) Pętla for</h2>
<pre>
for (inicjalizacja; warunek; krok) {
  // kod
}
</pre>
<p>Opis: służy do powtarzania kodu z góry znaną liczbą iteracji.</p>

<h2>2) Pętla while</h2>
<pre>
while (warunek) {
  // kod
}
</pre>
<p>Opis: sprawdza warunek przed pierwszym wykonaniem — może się nie wykonać.</p>

<h2>3) Pętla do...while</h2>
<pre>
do {
  // kod
} while (warunek);
</pre>
<p>Opis: wykona ciało przynajmniej raz, potem sprawdzi warunek.</p>


<h3>Schemat (for):</h3>
<pre>
inicjalizacja -> warunek? -> tak: ciało -> krok -> warunek?
               \-> nie: koniec
</pre>
