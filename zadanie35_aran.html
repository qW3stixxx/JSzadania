 <body> 
 <div style="color:forestgreen;font-size:35px;"> 
    <script language="JavaScript"> 
  var x=prompt("podaj liczbę x=",""); 
               var a_dana_ara=parseFloat(x); 
    document.write("czytana liczba x="+a_dana_ara+"<br>");     
         if(a_dana_ara>0) {document.write("czytana liczba jest większa od 0"+"<br>");} 
        else if(a_dana_ara==0) {document.write("czytana liczba jest równa 0"+"<br>");}
         else{document.write("czytana liczba jest mniejsza od 0"+"<br>");}
// Dokończ dwa pozostałe przypadki a==0   i  a<0 
// polskie litery mają działać(uzupełnij w kodzie strony) 
                  </script> 
 </div>
