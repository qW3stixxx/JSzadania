function Obw(a, b, h) {
 a = parseFloat(a);
 b = parseFloat(b);
 h = parseFloat(h);
 let podst = Math.abs(a - b) / 2;
 let ramie = Math.sqrt(podst * podst + h * h);
 let obwod = a + b + 2 * ramie;
 document.getElementsByName('obwod')[0].value = obwod.toFixed(2);
 pokaz2.innerHTML = "Obwód = " + obwod.toFixed(2);
}
